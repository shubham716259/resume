<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#121826" />
      <stop offset="100%" stop-color="#08090d" />
    </radialGradient>
    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Polygon Frame -->
  <rect x="5" y="5" width="90" height="90" rx="22" fill="url(#bgGlow)" stroke="url(#glowGrad)" stroke-width="2.5" />
  
  <!-- Inner subtle grid lines -->
  <line x1="20" y1="50" x2="80" y2="50" stroke="#00f0ff" stroke-opacity="0.1" stroke-width="1" />
  <line x1="50" y1="20" x2="50" y2="80" stroke="#8b5cf6" stroke-opacity="0.1" stroke-width="1" />
  
  <!-- Monogram ST -->
  <text x="50" y="63" font-family="'Space Grotesk', system-ui, sans-serif" font-weight="800" font-size="42" fill="url(#glowGrad)" text-anchor="middle" letter-spacing="-2" filter="url(#neonBlur)">ST</text>
  
  <!-- Top Right Live Status Dot -->
  <circle cx="82" cy="18" r="4.5" fill="#10b981" />
  <circle cx="82" cy="18" r="8" fill="#10b981" opacity="0.35" />
</svg>